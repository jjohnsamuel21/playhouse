services:
  - type: web
    name: playhouse-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:be
    startCommand: npm run -w @games/backend start
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: 3001
